# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Use the JDK 21 installed for Android builds (system default is JDK 25,
# which Android Gradle Plugin 8.x does not support).
org.gradle.java.home=/home/jimmyjangles/.local/share/jdk/jdk-21.0.13.1+2

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only keep resources for the languages the app actually ships.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
